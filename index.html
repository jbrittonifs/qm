## S1 | Indices and simultaneous equations | Lecture 1 | 1
K: \(x^a \times x^b = x^{a+b}\), \(\quad x^a \div x^b = x^{a-b}\), \(\quad (x^a)^b = x^{ab}\)
K: \(x^{-a} = \dfrac{1}{x^a}\), \(\quad x^{\frac{1}{n}} = \sqrt[n]{x}\), \(\quad x^0 = 1\)
K: Simultaneous equations: rearrange one equation for one unknown and substitute it into the other.

Q: Simplify \(x^3 \times x^5\).
+ \(x^8\)
- \(x^{15}\)
- \(x^2\)
- \(2x^8\)
W: Add the powers: \(x^{3+5} = x^8\).

Q: Simplify \(\left(x^3y^{-2}\right)^2 \times xy^5\).
+ \(x^7y\)
- \(x^6y^3\)
- \(x^7y^9\)
- \(x^5y\)
W: \(\left(x^3y^{-2}\right)^2 = x^6y^{-4}\), then \(x^6y^{-4} \times xy^5 = x^7y\).

Q: What is \(8^{\frac{2}{3}}\)?
+ \(4\)
- \(\frac{16}{3}\)
- \(6\)
- \(2\)
W: \(8^{\frac{2}{3}} = \left(\sqrt[3]{8}\right)^2 = 2^2 = 4\).

Q: What is \(x^{-\frac{1}{2}}\)?
+ \(\dfrac{1}{\sqrt{x}}\)
- \(-\sqrt{x}\)
- \(\dfrac{x}{2}\)
- \(-\dfrac{1}{2x}\)
W: A negative power means "one over", and a power of \(\frac{1}{2}\) is a square root.

Q: Simplify \(\dfrac{K^{\frac{1}{3}}L^{\frac{2}{3}}}{K^{-\frac{2}{3}}L^{\frac{2}{3}}}\).
+ \(K\)
- \(K^{-\frac{1}{3}}\)
- \(KL^{\frac{4}{3}}\)
- \(1\)
W: \(K^{\frac{1}{3} - (-\frac{2}{3})} = K^1\), and the \(L\) terms cancel.

Q: Simplify \((8K)^{\frac{2}{3}}\).
+ \(4K^{\frac{2}{3}}\)
- \(8K^{\frac{2}{3}}\)
- \(\frac{16}{3}K^{\frac{2}{3}}\)
- \(4K\)
W: Both parts get the power: \(8^{\frac{2}{3}} \times K^{\frac{2}{3}} = 4K^{\frac{2}{3}}\).

Q: Solve \(L = 8K\) and \(K + L = 45\).
+ \(K = 5,\ L = 40\)
- \(K = 40,\ L = 5\)
- \(K = 9,\ L = 36\)
- \(K = 4.5,\ L = 36\)
W: Substitute: \(K + 8K = 9K = 45\), so \(K = 5\) and \(L = 40\).

Q: Solve \(2K + L = 60\) and \(L = 4K\).
+ \(K = 10,\ L = 40\)
- \(K = 40,\ L = 10\)
- \(K = 15,\ L = 60\)
- \(K = 6,\ L = 24\)
W: Substitute: \(2K + 4K = 6K = 60\), so \(K = 10\), \(L = 40\).

Q: Solve \(K^{\frac{1}{3}}(8K)^{\frac{2}{3}} = 40\).
+ \(K = 10\)
- \(K = 5\)
- \(K = 40\)
- \(K = \frac{40}{8}\)
W: \(K^{\frac{1}{3}} \times 4K^{\frac{2}{3}} = 4K = 40\), so \(K = 10\).

Q: Solve \(3x + 2y = 24\) and \(3x = 2y\).
+ \(x = 4,\ y = 6\)
- \(x = 6,\ y = 4\)
- \(x = 4,\ y = 3\)
- \(x = 8,\ y = 12\)
W: \(2y + 2y = 24\), so \(y = 6\) and \(x = 4\).

## S2 | Logs and exponentials | Lecture 1 | 1
K: \(\ln\) undoes \(e\): \(\ln(e^x) = x\) and \(e^{\ln x} = x\). Also \(\ln 1 = 0\), \(\ln e = 1\).
K: \(\ln(ab) = \ln a + \ln b\), \(\quad \ln\left(\frac{a}{b}\right) = \ln a - \ln b\), \(\quad \ln(a^n) = n\ln a\)
K: The log trick: \(\ln\left(x^ay^b\right) = a\ln x + b\ln y\).

Q: Simplify \(\ln\left(e^5\right)\).
+ \(5\)
- \(5e\)
- \(e^5\)
- \(1\)
W: \(\ln\) undoes \(e\): \(\ln(e^x) = x\).

Q: \(\ln a + \ln b\) equals:
+ \(\ln(ab)\)
- \(\ln(a + b)\)
- \(\ln a \times \ln b\)
- \((\ln a)^b\)
W: Adding logs multiplies the insides.

Q: \(\ln\left(x^3y\right) - \ln(xy)\) equals:
+ \(2\ln x\)
- \(\ln(2x)\)
- \(3\)
- \(2\ln x + \ln y\)
W: \(\ln\dfrac{x^3y}{xy} = \ln x^2 = 2\ln x\).

Q: If \(e^{2t} = 9\), then \(t\) is:
+ \(\ln 3\)
- \(4.5\)
- \(\ln 4.5\)
- \(2\ln 9\)
W: Take logs: \(2t = \ln 9 = 2\ln 3\), so \(t = \ln 3\).

Q: \(\ln\left(x^{\frac{1}{2}}y^{\frac{1}{4}}\right)\) equals:
+ \(\frac{1}{2}\ln x + \frac{1}{4}\ln y\)
- \(\frac{1}{2}\ln x \times \frac{1}{4}\ln y\)
- \(\frac{1}{8}\ln(xy)\)
- \(\ln\left(\frac{1}{2}x\right) + \ln\left(\frac{1}{4}y\right)\)
W: The log of a product is a sum, and powers come out in front. This is the log trick for problem D.

Q: What is \(e^{\ln 7}\)?
+ \(7\)
- \(\ln 7\)
- \(7e\)
- \(1\)
W: \(e\) undoes \(\ln\).

Q: What is \(\ln 1\)?
+ \(0\)
- \(1\)
- \(e\)
- undefined
W: \(e^0 = 1\), so \(\ln 1 = 0\).

Q: Simplify \(\ln\left(3x^2y\right)\).
+ \(\ln 3 + 2\ln x + \ln y\)
- \(3 + 2\ln x + \ln y\)
- \(2\ln(3xy)\)
- \(6\ln(xy)\)
W: Split the product into a sum of logs, and bring the power 2 down.

Q: Why can we maximise \(\ln u\) instead of \(u\)?
+ \(\ln\) is an increasing function, so the same bundle maximises both
- \(\ln u\) is always bigger than \(u\)
- \(\ln u = u\) at the optimum
- It is only allowed when \(u\) is linear
W: Because \(\ln\) is increasing, whatever makes \(u\) biggest also makes \(\ln u\) biggest.

Q: Solve \(16 = 2^{x}\).
+ \(x = 4\)
- \(x = 8\)
- \(x = 3\)
- \(x = \ln 8\)
W: \(2^4 = 16\). (Or take logs: \(x\ln 2 = \ln 16 = 4\ln 2\).)

## S3 | Basic differentiation | Lecture 2 | 2
K: Power rule: \(\dfrac{d}{dx}\left(x^n\right) = nx^{n-1}\). Constants differentiate to 0.
K: Marginal cost is \(C'(q)\); the marginal product of labour is \(\dfrac{dY}{dL}\).
K: The second derivative \(f''(x)\) is the derivative of \(f'(x)\).

Q: Differentiate \(5x^4\).
+ \(20x^3\)
- \(5x^3\)
- \(20x^5\)
- \(4x^5\)
W: Bring the power down and reduce it by one: \(5 \times 4x^3\).

Q: Differentiate \(3x^4 - \dfrac{2}{x} + 5\).
+ \(12x^3 + 2x^{-2}\)
- \(12x^3 - 2x^{-2}\)
- \(12x^3 + 2x^{-2} + 5\)
- \(3x^3 - 2\ln x\)
W: Write \(\frac{2}{x} = 2x^{-1}\): its derivative is \(-2x^{-2}\), so \(-\frac{2}{x}\) gives \(+2x^{-2}\). The constant goes.

Q: Differentiate \(6\sqrt{x}\).
+ \(3x^{-\frac{1}{2}}\)
- \(6x^{-\frac{1}{2}}\)
- \(3x^{\frac{1}{2}}\)
- \(12x^{\frac{3}{2}}\)
W: \(6x^{\frac{1}{2}}\) differentiates to \(6 \times \frac{1}{2}x^{-\frac{1}{2}}\).

Q: \(C(q) = q^3 - 6q^2 + 20q + 50\). What is marginal cost when \(q = 2\)?
+ \(8\)
- \(74\)
- \(37\)
- \(20\)
W: \(MC = 3q^2 - 12q + 20 = 12 - 24 + 20 = 8\). (74 is the total cost, 37 the average cost.)

Q: \(Y = 10L^{\frac{1}{2}}\). What is the marginal product of labour?
+ \(5L^{-\frac{1}{2}}\)
- \(10L^{-\frac{1}{2}}\)
- \(5L^{\frac{1}{2}}\)
- \(20L^{\frac{3}{2}}\)
W: \(10 \times \frac{1}{2}L^{-\frac{1}{2}}\).

Q: Find \(f''(x)\) for \(f(x) = x^4 - 3x^2\).
+ \(12x^2 - 6\)
- \(4x^3 - 6x\)
- \(12x^2 - 6x\)
- \(12x - 6\)
W: \(f'(x) = 4x^3 - 6x\), then differentiate again.

Q: Differentiate \(\dfrac{x^3}{3} + 4x\).
+ \(x^2 + 4\)
- \(x^2 + 4x\)
- \(3x^2 + 4\)
- \(\frac{x^4}{12} + 2x^2\)
W: \(\frac{1}{3} \times 3x^2 + 4\).

Q: The gradient of \(y = x^2 - 4x\) at \(x = 3\) is:
+ \(2\)
- \(-3\)
- \(6\)
- \(0\)
W: \(y' = 2x - 4 = 6 - 4 = 2\).

## S4 | Stationary points and concavity | Lectures 2 and 3 | 2,3
K: Stationary points: solve \(f'(x) = 0\). Then \(f'' < 0\): maximum; \(f'' > 0\): minimum.
K: Concave where \(f''(x) < 0\); convex where \(f''(x) > 0\).
K: A local maximum need not be global: check the ends of the range and what happens as \(x \to \pm\infty\).
K: As \(x \to \pm\infty\) the highest power of \(x\) dominates.

Q: \(f(x) = x^3 - 3x^2\) has\ldots
+ a maximum at \(x = 0\) and a minimum at \(x = 2\)
- a minimum at \(x = 0\) and a maximum at \(x = 2\)
- minima at \(x = 0\) and \(x = 2\)
- one stationary point, at \(x = 3\)
W: \(f' = 3x(x - 2)\), \(f'' = 6x - 6\): \(f''(0) = -6 < 0\), \(f''(2) = 6 > 0\).

Q: For which values of \(x\) is \(f(x) = 2x^3 - 12x^2 + 5\) concave?
+ \(x < 2\)
- \(x > 2\)
- \(x < 4\)
- all \(x\)
W: \(f'' = 12x - 24 < 0\) when \(x < 2\).

Q: \(f(x) = x^3 - 3x\) has a stationary point at \(x = -1\). Which is true?
+ It is a local maximum, but not a global maximum
- It is a global maximum
- It is a local minimum
- It is not a stationary point
W: \(f''(-1) = -6 < 0\), but \(f(x) \to \infty\) as \(x \to \infty\), so it isn't the highest point overall.

Q: As \(x \to \infty\), \(f(x) = 5 + 3x^2 - x^3\) tends to:
+ \(-\infty\)
- \(+\infty\)
- \(5\)
- \(0\)
W: The highest power, \(-x^3\), dominates.

Q: As \(x \to -\infty\), \(f(x) = x^4 - 4x^3\) tends to:
+ \(+\infty\)
- \(-\infty\)
- \(0\)
- \(-4\)
W: \(x^4\) dominates and is positive for negative \(x\) too.

Q: At a stationary point, \(f''(x) = 0\). What can you conclude?
+ Nothing yet: the second derivative test is inconclusive
- It is a maximum
- It is a minimum
- It is not a stationary point
W: The test only works when \(f'' \neq 0\). Look at the sign of \(f'\) either side instead.

Q: For \(0 \leq x \leq 3\), where is the lowest value of \(c(x) = 1 + 4x - x^2\)?
+ At \(x = 0\) (an end of the range)
- At \(x = 2\) (the stationary point)
- At \(x = 3\)
- There is no lowest value
W: \(x = 2\) is a maximum (\(c'' = -2\)). Comparing the ends: \(c(0) = 1\), \(c(3) = 4\).

Q: \(f(x) = x^2(x - 6)\) crosses the \(x\)-axis at:
+ \(x = 0\) and \(x = 6\)
- \(x = 0\) and \(x = -6\)
- \(x = 6\) only
- \(x = 0\) and \(x = 4\)
W: A product is zero when either part is zero. (\(x = 4\) is a stationary point, not a root.)

Q: A function with \(f''(x) > 0\) for all \(x\) is:
+ convex, and any stationary point is a global minimum
- concave, and any stationary point is a global maximum
- increasing everywhere
- linear
W: Positive \(f''\) everywhere means the curve bends upwards everywhere.

## S5 | Product, chain, quotient; exp and ln | Lecture 3 | 3
K: Product: \((uv)' = u'v + uv'\). \(\quad\) Chain: \(\dfrac{dy}{dx} = \dfrac{dy}{du}\dfrac{du}{dx}\).
K: \(\dfrac{d}{dx}e^{f(x)} = f'(x)e^{f(x)}\), \(\quad \dfrac{d}{dx}\ln f(x) = \dfrac{f'(x)}{f(x)}\).
K: Quotient: \(\left(\dfrac{u}{v}\right)' = \dfrac{u'v - uv'}{v^2}\).
K: Treat any other letter, like \(a\) or \(y\), as a number: \(\dfrac{d}{dx}e^{xy} = ye^{xy}\).

Q: Differentiate \(x^2(3x + 1)^4\).
+ \(2x(3x + 1)^4 + 12x^2(3x + 1)^3\)
- \(24x(3x + 1)^3\)
- \(2x(3x + 1)^4 + 4x^2(3x + 1)^3\)
- \(8x(3x + 1)^3\)
W: Product rule; the chain rule gives \(4(3x + 1)^3 \times 3\).

Q: Differentiate \(e^{x^2 + 3x}\).
+ \((2x + 3)e^{x^2 + 3x}\)
- \(e^{x^2 + 3x}\)
- \((x^2 + 3x)e^{x^2 + 3x - 1}\)
- \((2x + 3)e^{2x + 3}\)
W: The exponential stays the same, times the derivative of the power.

Q: Differentiate \(\ln\left(4x^2 + 1\right)\).
+ \(\dfrac{8x}{4x^2 + 1}\)
- \(\dfrac{1}{4x^2 + 1}\)
- \(\dfrac{1}{8x}\)
- \(8x\ln\left(4x^2 + 1\right)\)
W: \(\frac{f'}{f}\) with \(f = 4x^2 + 1\).

Q: Differentiate \(\dfrac{x}{x + 1}\).
+ \(\dfrac{1}{(x + 1)^2}\)
- \(-\dfrac{1}{(x + 1)^2}\)
- \(\dfrac{2x + 1}{(x + 1)^2}\)
- \(1\)
W: \(\frac{1 \times (x + 1) - x \times 1}{(x + 1)^2}\).

Q: Differentiate \((1 - 8x)^5\).
+ \(-40(1 - 8x)^4\)
- \(5(1 - 8x)^4\)
- \(40(1 - 8x)^4\)
- \(-8(1 - 8x)^5\)
W: Chain rule: \(5(1 - 8x)^4 \times (-8)\).

Q: Treating \(y\) as a constant, differentiate \(e^{3xy}\) with respect to \(x\).
+ \(3ye^{3xy}\)
- \(e^{3xy}\)
- \(3xe^{3xy}\)
- \(3xye^{3xy - 1}\)
W: \(3y\) is just a number, like the \(a\) in \(e^{ax}\).

Q: Treating \(y\) as a constant, differentiate \(xe^{xy}\) with respect to \(x\).
+ \((1 + xy)e^{xy}\)
- \(ye^{xy}\)
- \(xye^{xy}\)
- \(e^{xy}\)
W: Product rule: \(1 \times e^{xy} + x \times ye^{xy}\).

Q: Differentiate \(\frac{1}{2}\ln x + \frac{1}{4}\ln y\) with respect to \(x\).
+ \(\dfrac{1}{2x}\)
- \(\dfrac{1}{2x} + \dfrac{1}{4y}\)
- \(\frac{1}{2}\ln x\)
- \(\dfrac{2}{x}\)
W: \(\frac{1}{4}\ln y\) doesn't depend on \(x\), so it disappears.

Q: Differentiate \(3qe^{q^2}\).
+ \(3e^{q^2} + 6q^2e^{q^2}\)
- \(6qe^{q^2}\)
- \(3e^{q^2}\)
- \(3e^{q^2} + 3q^2e^{q^2}\)
W: Product rule; the chain rule gives \(\frac{d}{dq}e^{q^2} = 2qe^{q^2}\).

Q: Differentiate \(\ln(5x)\).
+ \(\dfrac{1}{x}\)
- \(\dfrac{1}{5x}\)
- \(\dfrac{5}{x}\)
- \(5\ln x\)
W: \(\frac{5}{5x} = \frac{1}{x}\). Or: \(\ln(5x) = \ln 5 + \ln x\).

## S6 | Partial derivatives | Lecture 4 | 4
K: \(\dfrac{\partial f}{\partial x}\): differentiate with respect to \(x\), treating \(y\) as a constant.
K: Second order: \(f_{xx}\), \(f_{yy}\), and the cross-partials \(f_{xy} = f_{yx}\).
K: Partial derivatives are THE tool for problems C and D.

Q: For \(f(x, y) = x^2y^3 + 4x\), \(f_x\) is:
+ \(2xy^3 + 4\)
- \(3x^2y^2\)
- \(2xy^3\)
- \(2x + 3y^2 + 4\)
W: Treat \(y\) as a constant.

Q: For \(f(x, y) = x^2y^3 + 4x\), \(f_y\) is:
+ \(3x^2y^2\)
- \(3x^2y^2 + 4\)
- \(2xy^3\)
- \(3y^2\)
W: Treat \(x\) as a constant; \(4x\) differentiates to 0.

Q: For \(f(x, y) = e^{xy}\), the cross-partial \(f_{xy}\) is:
+ \((1 + xy)e^{xy}\)
- \(xye^{xy}\)
- \(e^{xy}\)
- \(y^2e^{xy}\)
W: \(f_x = ye^{xy}\); then the product rule in \(y\): \(e^{xy} + y \times xe^{xy}\).

Q: For \(g(x, y) = e^{xy} + x^2 - y^2\), \(g_{xx}\) is:
+ \(y^2e^{xy} + 2\)
- \(ye^{xy} + 2\)
- \(x^2e^{xy} - 2\)
- \(2\)
W: \(g_x = ye^{xy} + 2x\); differentiate again with respect to \(x\).

Q: \(Y = 5K^{\frac{1}{3}}L^{\frac{2}{3}}\). The marginal product of labour is:
+ \(\frac{10}{3}K^{\frac{1}{3}}L^{-\frac{1}{3}}\)
- \(\frac{5}{3}K^{-\frac{2}{3}}L^{\frac{2}{3}}\)
- \(\frac{10}{3}K^{\frac{1}{3}}L^{\frac{2}{3}}\)
- \(\frac{2}{3}K^{\frac{1}{3}}L^{-\frac{1}{3}}\)
W: Differentiate with respect to \(L\), treating \(K\) as a constant.

Q: For \(z = x^3 + 4xy + 5y^2\), the four second-order partials are:
+ \(z_{xx} = 6x,\ z_{yy} = 10,\ z_{xy} = z_{yx} = 4\)
- \(z_{xx} = 6x,\ z_{yy} = 10y,\ z_{xy} = 4,\ z_{yx} = 0\)
- \(z_{xx} = 3x^2,\ z_{yy} = 10,\ z_{xy} = z_{yx} = 4\)
- \(z_{xx} = 6x + 4,\ z_{yy} = 10,\ z_{xy} = z_{yx} = 0\)
W: \(z_x = 3x^2 + 4y\), \(z_y = 4x + 10y\); differentiate each again.

Q: \(Y = 5K^{\frac{1}{3}}L^{\frac{2}{3}}\). What happens to the MPL as \(L\) rises (holding \(K\) fixed)?
+ It falls: \(\frac{\partial^2 Y}{\partial L^2} < 0\)
- It rises: \(\frac{\partial^2 Y}{\partial L^2} > 0\)
- It stays constant
- It depends on \(K\)
W: \(\frac{\partial^2 Y}{\partial L^2} = -\frac{10}{9}K^{\frac{1}{3}}L^{-\frac{4}{3}} < 0\): diminishing returns to labour.

Q: For \(f(x, y) = x^3e^{-y}\), \(f_y\) is:
+ \(-x^3e^{-y}\)
- \(3x^2e^{-y}\)
- \(x^3e^{-y}\)
- \(-3x^2e^{-y}\)
W: The chain rule gives \(\frac{\partial}{\partial y}e^{-y} = -e^{-y}\); \(x^3\) is a constant.

## S7 | Homogeneity, returns to scale and Euler | Lectures 1 and 4 | 4
K: \(f\) is homogeneous of degree \(n\) if \(f(\lambda x, \lambda y) = \lambda^n f(x, y)\).
K: Euler: \(xf_x + yf_y = nf\).
K: \(n > 1\): increasing; \(n = 1\): constant; \(n < 1\): decreasing returns to scale.
K: Cobb-Douglas \(AK^aL^b\): the degree is \(a + b\) (the \(A\) doesn't matter).

Q: \(Y = 4K^{0.3}L^{0.6}\) is homogeneous of degree\ldots
+ \(0.9\), with decreasing returns to scale
- \(0.9\), with increasing returns to scale
- \(3.6\), with increasing returns to scale
- \(0.18\), with decreasing returns to scale
W: Degree \(= 0.3 + 0.6 = 0.9 < 1\). The 4 doesn't matter.

Q: For \(Y = K^{0.5}L^{0.7}\), \(K\frac{\partial Y}{\partial K} + L\frac{\partial Y}{\partial L}\) equals\ldots
+ \(1.2Y\), so increasing returns to scale
- \(1.2Y\), so decreasing returns to scale
- \(0.35Y\), so decreasing returns to scale
- \(Y\), so constant returns to scale
W: \(0.5Y + 0.7Y = 1.2Y\), and \(1.2 > 1\).

Q: A firm with \(Y = K^{0.4}L^{0.6}\) doubles both inputs. Output\ldots
+ exactly doubles
- more than doubles
- less than doubles
- rises by 40%
W: Degree \(0.4 + 0.6 = 1\): constant returns to scale.

Q: Is \(Y = KL + L\) homogeneous?
+ No: the two terms scale by different powers of \(\lambda\)
- Yes, of degree 2
- Yes, of degree 1
- Yes, of degree 3
W: \(\lambda^2KL + \lambda L\) can't be written as \(\lambda^n(KL + L)\).

Q: \(f(x, y) = 2x^2y^2 + xy^3\) is homogeneous of degree:
+ \(4\)
- \(2\)
- \(3\)
- \(7\)
W: Every term has total power 4: \(f(\lambda x, \lambda y) = \lambda^4f\).

Q: \(Y = 3K + 2L\) has\ldots
+ constant returns to scale
- increasing returns to scale
- decreasing returns to scale
- no returns to scale (not homogeneous)
W: \(3\lambda K + 2\lambda L = \lambda(3K + 2L)\): degree 1.

Q: \(Y = K^{0.3}L^{0.9}\). Doubling both inputs multiplies output by:
+ \(2^{1.2} \approx 2.3\)
- \(2.4\)
- \(2\)
- \(1.2\)
W: Degree 1.2, so output is multiplied by \(2^{1.2}\).

Q: Which production function has increasing returns to scale?
+ \(K^{2}L^{-0.5}\)
- \(10K^{0.2}L^{0.7}\)
- \(K^{0.5}L^{0.5}\)
- \(5K^{0.25}L^{0.25}\)
W: Degrees: \(1.5\), \(0.9\), \(1\), \(0.5\). Only the first is above 1.

## S8 | MRS and the slope of an isoquant | Lecture 4 | 4
K: Slope of the isoquant of \(z(x, y)\): \(\dfrac{dy}{dx} = -\dfrac{z_x}{z_y}\).
K: \(MRS = -\dfrac{MU_1}{MU_2}\), \(\quad MRTS = -\dfrac{MPL}{MPK}\).
K: MRS less negative as \(x_1\) rises: convex indifference curves.

Q: The MRS for \(u = x_1^2x_2\) is:
+ \(-\dfrac{2x_2}{x_1}\)
- \(-\dfrac{x_1}{2x_2}\)
- \(-\dfrac{x_2}{x_1}\)
- \(-2\)
W: \(-\frac{MU_1}{MU_2} = -\frac{2x_1x_2}{x_1^2}\).

Q: The MRS for \(u = x_1^ax_2^b\) is:
+ \(-\dfrac{ax_2}{bx_1}\)
- \(-\dfrac{bx_1}{ax_2}\)
- \(-\dfrac{a}{b}\)
- \(-abx_1x_2\)
W: \(-\frac{ax_1^{a-1}x_2^b}{bx_1^ax_2^{b-1}} = -\frac{ax_2}{bx_1}\).

Q: The slope of the isoquant of \(z = x^2 + 2y^2\) at \((2, 1)\) is:
+ \(-1\)
- \(-4\)
- \(-\frac{1}{4}\)
- \(1\)
W: \(\frac{dy}{dx} = -\frac{2x}{4y} = -\frac{4}{4}\).

Q: For \(u = 3x_1 + x_2\), the MRS is:
+ \(-3\) everywhere: straight-line indifference curves
- \(-\frac{1}{3}\) everywhere
- \(-\frac{3x_2}{x_1}\)
- \(0\)
W: \(MU_1 = 3\), \(MU_2 = 1\): the MRS is constant.

Q: Along a Cobb-Douglas indifference curve, as \(x_1\) increases the MRS\ldots
+ becomes less negative: the curve gets flatter (convex)
- becomes more negative: the curve gets steeper
- stays constant
- becomes positive
W: \(MRS = -\frac{ax_2}{bx_1}\): more \(x_1\) and less \(x_2\) makes it smaller in size.

Q: The MRTS for \(Y = K^{\frac{1}{3}}L^{\frac{2}{3}}\) (slope with \(K\) on the vertical axis) is:
+ \(-\dfrac{2K}{L}\)
- \(-\dfrac{K}{2L}\)
- \(-\dfrac{L}{2K}\)
- \(-2\)
W: \(-\frac{MPL}{MPK} = -\frac{\frac{2}{3}K^{\frac{1}{3}}L^{-\frac{1}{3}}}{\frac{1}{3}K^{-\frac{2}{3}}L^{\frac{2}{3}}} = -\frac{2K}{L}\).

Q: Tony has \(u = x^4y^2\) and Gordon has \(v = \ln x + \frac{1}{2}\ln y\). Their MRSs are:
+ the same: \(-\frac{2y}{x}\)
- different: Tony's is twice Gordon's
- the same: \(-\frac{y}{2x}\)
- not comparable
W: \(v = \frac{1}{4}\ln u\) is an increasing transformation, so the MRS is the same.

## S9 | Classifying stationary points of f(x, y) | Lecture 5 | 4
K: First-order conditions: \(f_x = 0\) and \(f_y = 0\).
K: Let \(D = f_{xx}f_{yy} - f_{xy}^2\). \(\ D > 0\) and \(f_{xx}, f_{yy} < 0\): maximum.
K: \(D > 0\) and \(f_{xx}, f_{yy} > 0\): minimum. \(\ D < 0\): saddle point.
K: At a point where \(y = 0\), every \(e^{xy}\) equals \(e^0 = 1\).

Q: At a stationary point, \(f_{xx} = 3\), \(f_{yy} = 2\) and \(f_{xy} = 4\). The point is a:
+ saddle point
- minimum
- maximum
- can't tell
W: \(D = 6 - 16 = -10 < 0\).

Q: At a stationary point, \(f_{xx} = -2\), \(f_{yy} = -6\) and \(f_{xy} = -1\). The point is a:
+ maximum
- minimum
- saddle point
- can't tell
W: \(D = 12 - 1 = 11 > 0\) and both are negative.

Q: The first-order conditions for a stationary point of \(f(x, y)\) are:
+ \(f_x = 0\) and \(f_y = 0\)
- \(f_{xx} = 0\) and \(f_{yy} = 0\)
- \(f(x, y) = 0\)
- \(f_x = f_y\)
W: The slope must be zero in both directions.

Q: A stationary point is a minimum if:
+ \(f_{xx} > 0\), \(f_{yy} > 0\) and \(f_{xx}f_{yy} - f_{xy}^2 > 0\)
- \(f_{xx} > 0\) and \(f_{yy} > 0\)
- \(f_{xx}f_{yy} - f_{xy}^2 < 0\)
- \(f_{xx} < 0\), \(f_{yy} < 0\) and \(f_{xx}f_{yy} - f_{xy}^2 > 0\)
W: Both own second derivatives positive is not enough: \(D > 0\) is needed too.

Q: At the point \((2, 0)\), \(e^{xy}\) equals:
+ \(1\)
- \(0\)
- \(e^2\)
- \(2\)
W: \(xy = 0\), and \(e^0 = 1\).

Q: Find the stationary point of \(f = -x^2 + xy - 2y^2 - 3x + 12y\).
+ \((0, 3)\)
- \((3, 0)\)
- \((-3, 12)\)
- \((0, 0)\)
W: \(f_x = -2x + y - 3 = 0\), \(f_y = x - 4y + 12 = 0\). Solving gives \(x = 0\), \(y = 3\).

Q: \(f = x^3 - 3x + y^2 - 4y\). The stationary point at \((-1, 2)\) is a:
+ saddle point
- maximum
- minimum
- not a stationary point
W: \(f_{xx} = 6x = -6\), \(f_{yy} = 2\), \(f_{xy} = 0\): \(D = -12 < 0\).

Q: How many stationary points does \(f = x^3 + y^3 - 3x - 3y\) have?
+ \(4\)
- \(1\)
- \(2\)
- \(0\)
W: \(x = \pm 1\) and \(y = \pm 1\) give four combinations: a min, a max and two saddles.

## S10 | Setting up and solving Lagrangians | Lecture 6 | 5
K: \(\mathcal{L} = \text{objective} - \lambda(\text{constraint expression} - \text{number})\).
K: First-order conditions: \(\mathcal{L}_x = 0\), \(\mathcal{L}_y = 0\), \(\mathcal{L}_\lambda = 0\). Divide the first two so \(\lambda\) cancels.
K: \(\lambda\) is the marginal value of the constraint: marginal cost (cost min) or marginal utility of income.
K: For utility, take logs first: \(\ln\left(x^ay^b\right) = a\ln x + b\ln y\).

Q: A consumer maximises \(u = x^{\frac{1}{2}}y^{\frac{1}{2}}\) with \(p_x = 3\), \(p_y = 2\), income 60. The Lagrangian is:
+ \(x^{\frac{1}{2}}y^{\frac{1}{2}} - \lambda(3x + 2y - 60)\)
- \(x^{\frac{1}{2}}y^{\frac{1}{2}} - \lambda(2x + 3y - 60)\)
- \(3x + 2y - \lambda\left(x^{\frac{1}{2}}y^{\frac{1}{2}} - 60\right)\)
- \(x^{\frac{1}{2}}y^{\frac{1}{2}} - \lambda(3x + 2y)\)
W: Objective minus \(\lambda\) times (spending minus income).

Q: A firm minimises cost with \(r = 9\), \(w = 4\) to produce 60 units with \(Y = K^{\frac{1}{2}}L^{\frac{1}{2}}\). The Lagrangian is:
+ \(9K + 4L - \lambda\left(K^{\frac{1}{2}}L^{\frac{1}{2}} - 60\right)\)
- \(K^{\frac{1}{2}}L^{\frac{1}{2}} - \lambda(9K + 4L - 60)\)
- \(9K + 4L - \lambda\left(K^{\frac{1}{2}}L^{\frac{1}{2}}\right)\)
- \(4K + 9L - \lambda\left(K^{\frac{1}{2}}L^{\frac{1}{2}} - 60\right)\)
W: The objective is cost; the constraint is output \(= 60\).

Q: Income is 100 now and nothing next period; the interest rate is 5%. The budget constraint is:
+ \(c_1 + \dfrac{c_2}{1.05} = 100\)
- \(c_1 + c_2 = 100\)
- \(c_1 + 1.05c_2 = 100\)
- \(1.05c_1 + c_2 = 100\)
W: \(c_2 = 1.05(100 - c_1)\); rearrange.

Q: The FOCs include \(\dfrac{1}{2x} = 3\lambda\) and \(\dfrac{1}{2y} = 2\lambda\). Eliminating \(\lambda\) gives:
+ \(2y = 3x\)
- \(3y = 2x\)
- \(x = y\)
- \(6xy = 1\)
W: Divide: \(\frac{y}{x} = \frac{3}{2}\).

Q: If \(2y = 3x\) and \(3x + 2y = 60\), then:
+ \(x = 10,\ y = 15\)
- \(x = 15,\ y = 10\)
- \(x = 12,\ y = 12\)
- \(x = 20,\ y = 0\)
W: \(3x + 3x = 60\).

Q: In a cost minimisation problem, \(\lambda = 4\) at the optimum. This means:
+ one more unit of output would raise minimum cost by about 4
- the firm uses 4 times as much labour as capital
- the firm's profit is 4
- output would rise by 4 if costs rose by 1
W: \(\lambda\) is the marginal cost of output.

Q: A worker has 16 hours, wage 10, other income 20; \(C\) is consumption and \(R\) leisure. The budget constraint is:
+ \(C + 10R = 180\)
- \(C + 10R = 160\)
- \(C = 10R + 20\)
- \(C + R = 16\)
W: \(C = 10(16 - R) + 20\); rearrange.

Q: The FOCs for a cost minimisation give \(16 = \tfrac{1}{5}\lambda K^{-\frac{4}{5}}L^{\frac{4}{5}}\) and \(2 = \tfrac{4}{5}\lambda K^{\frac{1}{5}}L^{-\frac{1}{5}}\). Dividing gives:
+ \(L = 32K\)
- \(K = 32L\)
- \(L = 8K\)
- \(L = 2K\)
W: \(\frac{16}{2} = \frac{\frac{1}{5}K^{-\frac{4}{5}}L^{\frac{4}{5}}}{\frac{4}{5}K^{\frac{1}{5}}L^{-\frac{1}{5}}} = \frac{L}{4K}\), so \(L = 32K\).

Q: Which statement about Method 1 (tangency) is right for cost minimisation?
+ Set \(\frac{w}{r} = \frac{MPL}{MPK}\) and use the output constraint
- Set \(\frac{w}{r} = \frac{MPK}{MPL}\) and use the budget constraint
- Set \(MPL = MPK\)
- Set \(w = r\)
W: The isocost slope equals the isoquant slope: \(\frac{w}{r} = \frac{MPL}{MPK}\).

 { u: R`x^{\frac{1}{3}}y^{\frac{2}{3}}`, px: 2, py: 4, m: 90,
   logs: [R`\tfrac{1}{3}\ln x + \tfrac{2}{3}\ln y`, R`\tfrac{2}{9}\ln(xy)`, R`\ln\left(\tfrac{1}{3}x\right) + \ln\left(\tfrac{2}{3}y\right)`, R`\tfrac{1}{3}\ln x \times \tfrac{2}{3}\ln y`],
   foc: [R`\dfrac{1}{3x} = 2\lambda,\ \ \dfrac{2}{3y} = 4\lambda`, R`\dfrac{1}{3x} = 4\lambda,\ \ \dfrac{2}{3y} = 2\lambda`, R`\tfrac{1}{3}\ln x = 2\lambda,\ \ \tfrac{2}{3}\ln y = 4\lambda`, R`\dfrac{x}{3} = 2\lambda,\ \ \dfrac{2y}{3} = 4\lambda`],
   ratio: [R`y = x`, R`y = 4x`, R`y = \tfrac{1}{2}x`, R`x = 2y`], ratioWhy: R`Divide: \(\frac{1/(3x)}{2/(3y)} = \frac{2}{4}\), so \(\frac{y}{2x} = \frac{1}{2}\) and \(y = x\).`,
   xy: [R`x = 15,\ y = 15`, R`x = 5,\ y = 20`, R`x = 30,\ y = 7.5`, R`x = 45,\ y = 0`], xyWhy: R`Budget: \(2x + 4x = 90\), so \(x = y = 15\).` },
 { u: R`x^{0.6}y^{0.4}`, px: 3, py: 2, m: 50,
   logs: [R`0.6\ln x + 0.4\ln y`, R`0.24\ln(xy)`, R`\ln(0.6x) + \ln(0.4y)`, R`0.6\ln x \times 0.4\ln y`],
   foc: [R`\dfrac{0.6}{x} = 3\lambda,\ \ \dfrac{0.4}{y} = 2\lambda`, R`\dfrac{0.6}{x} = 2\lambda,\ \ \dfrac{0.4}{y} = 3\lambda`, R`0.6\ln x = 3\lambda,\ \ 0.4\ln y = 2\lambda`, R`0.6x = 3\lambda,\ \ 0.4y = 2\lambda`],
   ratio: [R`y = x`, R`y = 1.5x`, R`y = \tfrac{2}{3}x`, R`x = 2.25y`], ratioWhy: R`Divide: \(\frac{0.6/x}{0.4/y} = \frac{3}{2}\), so \(\frac{1.5y}{x} = 1.5\) and \(y = x\).`,
   xy: [R`x = 10,\ y = 10`, R`x = 6,\ y = 16`, R`x = 12,\ y = 7`, R`x = 4,\ y = 19`], xyWhy: R`Budget: \(3x + 2x = 50\), so \(x = y = 10\).` },
 { u: R`x^{\frac{1}{3}}y^{\frac{2}{3}}`, px: 2, py: 5, m: 120,
   logs: [R`\tfrac{1}{3}\ln x + \tfrac{2}{3}\ln y`, R`\tfrac{2}{9}\ln(xy)`, R`\ln\left(\tfrac{1}{3}x\right) + \ln\left(\tfrac{2}{3}y\right)`, R`\tfrac{1}{3}\ln x \times \tfrac{2}{3}\ln y`],
   foc: [R`\dfrac{1}{3x} = 2\lambda,\ \ \dfrac{2}{3y} = 5\lambda`, R`\dfrac{1}{3x} = 5\lambda,\ \ \dfrac{2}{3y} = 2\lambda`, R`\tfrac{1}{3}\ln x = 2\lambda,\ \ \tfrac{2}{3}\ln y = 5\lambda`, R`\dfrac{x}{3} = 2\lambda,\ \ \dfrac{2y}{3} = 5\lambda`],
   ratio: [R`y = \tfrac{4}{5}x`, R`y = \tfrac{5}{4}x`, R`y = x`, R`y = \tfrac{2}{5}x`], ratioWhy: R`Divide: \(\frac{1/(3x)}{2/(3y)} = \frac{2}{5}\), so \(\frac{y}{2x} = \frac{2}{5}\) and \(y = \frac{4}{5}x\).`,
   xy: [R`x = 20,\ y = 16`, R`x = 16,\ y = 20`, R`x = 40,\ y = 8`, R`x = 10,\ y = 20`], xyWhy: R`Budget: \(2x + 5 \times \frac{4}{5}x = 6x = 120\), so \(x = 20\), \(y = 16\).` },
 { u: R`x^{\frac{1}{2}}y^{\frac{1}{2}}`, px: 3, py: 2, m: 60,
   logs: [R`\tfrac{1}{2}\ln x + \tfrac{1}{2}\ln y`, R`\tfrac{1}{4}\ln(xy)`, R`\ln\left(\tfrac{1}{2}x\right) + \ln\left(\tfrac{1}{2}y\right)`, R`\tfrac{1}{2}\ln x \times \tfrac{1}{2}\ln y`],
   foc: [R`\dfrac{1}{2x} = 3\lambda,\ \ \dfrac{1}{2y} = 2\lambda`, R`\dfrac{1}{2x} = 2\lambda,\ \ \dfrac{1}{2y} = 3\lambda`, R`\tfrac{1}{2}\ln x = 3\lambda,\ \ \tfrac{1}{2}\ln y = 2\lambda`, R`\dfrac{x}{2} = 3\lambda,\ \ \dfrac{y}{2} = 2\lambda`],
   ratio: [R`2y = 3x`, R`3y = 2x`, R`y = x`, R`6xy = 1`], ratioWhy: R`Divide: \(\frac{1/(2x)}{1/(2y)} = \frac{3}{2}\), so \(\frac{y}{x} = \frac{3}{2}\).`,
   xy: [R`x = 10,\ y = 15`, R`x = 15,\ y = 10`, R`x = 12,\ y = 12`, R`x = 20,\ y = 0`], xyWhy: R`Budget: \(3x + 3x = 60\), so \(x = 10\), \(y = 15\).` }
];
</script>

<script>
// =====================================================================================
// APP
// =====================================================================================
const PROBLEMS = {
  A: { name: 'Sketch a function', lecture: 'Lectures 2 and 3', marks: 20,
       blurb: 'Intercepts, limits, stationary points, their nature, concavity, and the sketch.' },
  B: { name: 'Returns to scale', lecture: 'Lectures 1 and 4', marks: 10,
       blurb: "Euler's theorem, the direct check, the degree, and returns to scale." },
  C: { name: 'Maxima and minima of f(x, y)', lecture: 'Lectures 4 and 5', marks: 15,
       blurb: 'State the conditions, show a point is stationary, find the second-order partials, classify.' },
  D: { name: 'Constrained optimisation', lecture: 'Lecture 6', marks: 20,
       blurb: 'Cost minimisation with a Lagrangian, then utility maximisation using logs.' }
};
const WEEK_TOPICS = { 1: 'Lecture 1', 2: 'Lecture 2', 3: 'Lecture 3', 4: 'Lectures 4 and 5', 5: 'Lecture 6' };

// ---------- small helpers ----------
const $app = () => document.getElementById('app');
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function m(s) { return '\\(' + s + '\\)'; }              // wrap a bare TeX string as inline maths
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
function typeset(el) {
  if (window.MathJax && MathJax.typesetPromise) { MathJax.typesetClear && MathJax.typesetClear([el]); return MathJax.typesetPromise([el]).catch(() => {}); }
  setTimeout(() => typeset(el), 150);
}
function store(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem('qm-' + k)); localStorage.setItem('qm-' + k, JSON.stringify(v)); } catch (e) { return null; } }
function setTitle(t, showBack) {
  document.getElementById('title').textContent = t;
  document.getElementById('back').classList.toggle('hidden', !showBack);
}
function render(html) { const el = $app(); el.innerHTML = html; window.scrollTo(0, 0); typeset(el); }
function go(h) { location.hash = h; }
function goBack() { if (history.length > 1) history.back(); else go('#/'); }

// ---------- parse the skill bank ----------
function parseBank() {
  const lines = document.getElementById('skill-bank').textContent.split('\n');
  const skills = []; let s = null, q = null;
  for (let raw of lines) {
    const line = raw.trim();
    if (!line || (line.startsWith('#') && !line.startsWith('##'))) continue;
    if (line.startsWith('##')) {
      const p = line.slice(2).split('|').map(x => x.trim());
      s = { id: p[0], name: p[1], lecture: p[2] || '', weeks: (p[3] || '').split(',').map(x => +x.trim()).filter(Boolean), facts: [], qs: [] };
      skills.push(s); q = null;
    } else if (!s) continue;
    else if (line.startsWith('K:')) s.facts.push(line.slice(2).trim());
    else if (line.startsWith('Q:')) { q = { q: line.slice(2).trim(), opts: [], why: '' }; s.qs.push(q); }
    else if (q && line.startsWith('+')) q.opts.push({ t: line.slice(1).trim(), ok: true });
    else if (q && line.startsWith('-')) q.opts.push({ t: line.slice(1).trim(), ok: false });
    else if (q && line.startsWith('W:')) q.why = line.slice(2).trim();
  }
  return skills;
}
const SKILLS = parseBank();
const skillById = id => SKILLS.find(s => s.id === id);

// ---------- the quiz engine (used by skills, weekly tests and exam questions) ----------
// item = { q, opts:[{t, ok, svg?}], why, part?, marks?, grid? }
function runQuiz(cfg) {
  const st = { i: 0, score: 0, marks: 0, items: cfg.items.map(it => Object.assign({}, it, { opts: it.keep ? it.opts : shuffle(it.opts) })) };
  const total = st.items.length;
  function show() {
    const it = st.items[st.i];
    const head = `<div class="qhead"><span>${it.part ? `<span class="part">${esc(it.part)}</span>` : ''} Question ${st.i + 1} of ${total}</span>
      <span>${it.marks ? it.marks + (it.marks > 1 ? ' marks' : ' mark') : ''}</span></div>
      <div class="progress"><div style="width:${100 * st.i / total}%"></div></div>`;
    const opts = it.opts.map((o, k) => `<button class="opt" data-k="${k}">${o.svg ? o.t : esc(o.t)}</button>`).join('');
    render(`${cfg.header || ''}<div class="qcard">${head}<div class="qtext">${it.html ? it.q : esc(it.q)}</div>
      <div class="${it.grid ? 'optgrid' : ''}">${opts}</div><div id="fb"></div></div>`);
    document.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(+b.dataset.k));
  }
  function answer(k) {
    const it = st.items[st.i], ok = it.opts[k].ok;
    document.querySelectorAll('.opt').forEach((b, j) => {
      b.disabled = true;
      if (it.opts[j].ok) b.classList.add('correct'); else if (j === k) b.classList.add('wrong');
    });
    if (ok) { st.score++; st.marks += it.marks || 0; }
    const last = st.i === total - 1;
    const fb = document.getElementById('fb');
    fb.innerHTML = `<div class="feedback ${ok ? 'good' : 'bad'}"><b>${ok ? 'Correct.' : 'Not quite.'}</b>${esc(it.why || '')}</div>
      <button class="btn wide" id="next">${last ? 'See results' : 'Next'}</button>`;
    typeset(fb);
    document.getElementById('next').onclick = () => { if (last) cfg.done(st); else { st.i++; show(); } };
    fb.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
  show();
}

// ---------- views ----------
function viewHome() {
  setTitle('QM Maths Practice', false);
  const tiles = Object.entries(PROBLEMS).map(([k, p]) => `
    <button class="tile" onclick="go('#/exam/${k}')"><span class="badge">${bestBadge('exam-' + k, p.marks)}</span>
      <div class="t"><span class="letter">${k}</span>${esc(p.name)}</div><div class="s">${esc(p.blurb)}</div></button>`).join('');
  render(`<h1>The four problems you'll solve</h1>
    <p class="muted">The maths exam is made of these four types of question. Practise each one step by step, with a new version every time.</p>
    ${tiles}
    <h2>Build the skills</h2>
    <button class="tile" onclick="go('#/skills')"><div class="t">Key skills</div><div class="s">Short multiple-choice drills on each tool, in the order we teach them.</div></button>
    <button class="tile" onclick="go('#/weekly')"><div class="t">Weekly test practice</div><div class="s">Five questions in the style of the in-class tests.</div></button>
    <p class="muted" style="margin-top:1rem">Tip: for the exam questions, try each part on paper first, then tap your answer.
    Your progress is saved on this phone only.</p>`);
}
function bestBadge(key, outOf) { const b = store('best-' + key); return b === null || b === undefined ? '' : `Best ${b}/${outOf}`; }

function viewSkills() {
  setTitle('Key skills', true);
  render(`<h1>Key skills</h1><p class="muted">Each drill picks up to 10 questions at random.</p>` +
    SKILLS.map(s => `<button class="tile" onclick="go('#/skill/${s.id}')"><span class="badge">${bestBadge('skill-' + s.id, Math.min(10, s.qs.length))}</span>
      <div class="t">${esc(s.name)}</div><div class="s">${esc(s.lecture)} &middot; ${s.qs.length} questions</div></button>`).join(''));
}

function viewSkill(id) {
  const s = skillById(id); if (!s) return go('#/skills');
  setTitle(s.name, true);
  render(`<h1>${esc(s.name)}</h1><p class="muted">${esc(s.lecture)}</p>
    <div class="facts"><b>Key facts</b><ul>${s.facts.map(f => `<li>${esc(f)}</li>`).join('')}</ul></div>
    <button class="btn wide" id="start">Start (${Math.min(10, s.qs.length)} questions)</button>`);
  document.getElementById('start').onclick = () => startSkill(s);
}
function startSkill(s) {
  const n = Math.min(10, s.qs.length);
  runQuiz({ items: shuffle(s.qs).slice(0, n),
    done: st => results(`${s.name}`, st.score, n, 'skill-' + s.id, () => startSkill(s), '#/skills') });
}
function results(name, score, outOf, key, again, backHash, extra) {
  const prev = store('best-' + key);
  if (prev === null || prev === undefined || score > prev) store('best-' + key, score);
  const msg = score === outOf ? 'Perfect.' : score >= 0.7 * outOf ? 'Good work.' : 'Have another go: the questions change each time.';
  render(`<h1>${esc(name)}</h1><div class="card" style="text-align:center"><div class="big">${score} / ${outOf}</div><p>${msg}</p></div>
    ${extra || ''}
    <div class="row"><button class="btn" id="again">Try again</button><button class="btn secondary" onclick="go('${backHash}')">Done</button></div>`);
  document.getElementById('again').onclick = again;
}

function viewWeekly() {
  setTitle('Weekly test practice', true);
  render(`<h1>Weekly test practice</h1><p class="muted">Five questions, like the 10-minute tests in class. A new mix each time.</p>` +
    [1, 2, 3, 4, 5].map(w => `<button class="tile" onclick="go('#/week/${w}')"><span class="badge">${bestBadge('week-' + w, 5)}</span>
      <div class="t">Week ${w}</div><div class="s">${WEEK_TOPICS[w]}</div></button>`).join(''));
}
function viewWeek(w) {
  w = +w; setTitle('Week ' + w + ' practice test', true);
  const pool = SKILLS.filter(s => s.weeks.includes(w)).flatMap(s => s.qs);
  render(`<h1>Week ${w} practice test</h1><p class="muted">${WEEK_TOPICS[w]} &middot; 5 questions &middot; aim for 10 minutes</p>
    <div class="card">No notes or calculator: treat it like the real thing. Work on paper, then tap your answer.</div>
    <button class="btn wide" id="start">Start</button>`);
  document.getElementById('start').onclick = () => startWeek(w, pool);
}
function startWeek(w, pool) {
  const t0 = Date.now();
  runQuiz({ items: shuffle(pool).slice(0, 5),
    done: st => { const mins = Math.round((Date.now() - t0) / 6000) / 10;
      results('Week ' + w + ' practice test', st.score, 5, 'week-' + w, () => startWeek(w, pool), '#/weekly',
        `<p class="muted" style="text-align:center">Time taken: ${mins} minutes</p>`); } });
}

// ---------- exam questions ----------
function viewExam(k) {
  const P = PROBLEMS[k]; if (!P) return go('#/');
  setTitle('Problem ' + k + ': ' + P.name, true);
  const ex = GENERATE[k]();
  render(`<h1><span class="letter">${k}</span>${esc(P.name)}</h1><p class="muted">${esc(P.lecture)} &middot; ${P.marks} marks &middot; a new version each time</p>
    <div class="exam">${ex.question}</div>
    <p class="muted">Try it on paper first. Then go through it step by step: each step is one part of the exam answer.</p>
    <div class="row"><button class="btn" id="start">Start the steps</button><button class="btn secondary" id="another">New version</button></div>`);
  document.getElementById('another').onclick = () => viewExam(k);
  document.getElementById('start').onclick = () => runQuiz({ items: ex.steps, header: `<div class="exam" style="font-size:.9rem">${ex.short}</div>`,
    done: st => {
      const model = `<h2>Model answer</h2><div class="model">${ex.steps.map(s => { const a = s.opts.find(o => o.ok);
        return `<div class="step"><b>${esc(s.part)}</b> ${a.svg ? '' : '<b>' + esc(a.t) + '</b><br>'}<span class="muted">${esc(s.why)}</span></div>`; }).join('')}</div>`;
      results('Problem ' + k + ': marks', st.marks, P.marks, 'exam-' + k, () => viewExam(k), '#/', model);
    } });
}
function opts(list) { return list.map((t, i) => ({ t: t, ok: i === 0 })); }
function optsM(list) { return list.map((t, i) => ({ t: m(t), ok: i === 0 })); }

const GENERATE = {
  A() {
    const v = pick(A_VARIANTS);
    const f = m('f(x) = ' + v.f);
    const question = `<p>Consider the function ${f}.</p><ol type="a">
      <li>Find where the function crosses the \\(x\\)- and \\(y\\)-axes. <span class="marks">[3]</span></li>
      <li>What happens to \\(f(x)\\) as \\(x \\to \\infty\\) and as \\(x \\to -\\infty\\)? <span class="marks">[2]</span></li>
      <li>Find the stationary points (both coordinates). <span class="marks">[4]</span></li>
      <li>Use the second derivative to determine their nature. <span class="marks">[4]</span></li>
      <li>For which values of \\(x\\) is the function concave, and for which convex? <span class="marks">[3]</span></li>
      <li>Sketch the function. <span class="marks">[4]</span></li></ol>`;
    const limOrder = [v.lim].concat(Object.keys(LIMITS).filter(k => k !== v.lim));
    const steps = [
      { part: '(a)', marks: 3, q: `Where does ${f} cross the x-axis?`, opts: opts(v.roots), why: v.rootsWhy },
      { part: '(b)', marks: 2, q: `What happens to ${f} as x gets very large (positive and negative)?`, opts: opts(limOrder.map(k => LIMITS[k])), why: v.limWhy },
      { part: '(c)', marks: 2, q: `What is f'(x)?`, opts: opts(v.fp), why: R`Power rule on each term: \(f'(x) = ` + v.fp[0].slice(2, -2) + R`\).` },
      { part: '(c)', marks: 2, q: `The stationary points are:`, opts: opts(v.sp), why: v.spWhy },
      { part: '(d)', marks: 4, q: `Their nature is:`, opts: opts(v.nat), why: v.natWhy },
      { part: '(e)', marks: 3, q: `Where is the function concave and where convex?`, opts: opts(v.conc), why: v.concWhy },
      { part: '(f)', marks: 4, q: `Which is the sketch of ${f}?`, grid: true, opts: sketchOptions(v), why: R`Use (a) for the intercepts, (b) for the ends, (c)-(d) for the turning points and (e) for the bends.` }
    ];
    return { question, short: `${f}`, steps };
  },
  B() {
    const v = pick(B_VARIANTS);
    const Y = m('Y = ' + v.Y);
    const question = `<p>A firm has production function ${Y}.</p><ol type="a">
      <li>Use Euler's theorem to show that \\(Y\\) is homogeneous, and state its degree. <span class="marks">[5]</span></li>
      <li>Show directly that \\(Y(\\lambda K, \\lambda L) = \\lambda^n Y(K, L)\\). <span class="marks">[3]</span></li>
      <li>Does the firm have increasing, constant or decreasing returns to scale? If it doubled both inputs, what would happen to output? <span class="marks">[2]</span></li></ol>`;
    const rtsList = ['increasing', 'constant', 'decreasing'];
    const steps = [
      { part: '(a)', marks: 1, q: R`What is \(\dfrac{\partial Y}{\partial K}\)?`, opts: optsM(v.YK), why: R`Treat \(L\) as a constant: bring the power of \(K\) down and reduce it by one.` },
      { part: '(a)', marks: 1, q: R`What is \(\dfrac{\partial Y}{\partial L}\)?`, opts: optsM(v.YL), why: R`Treat \(K\) as a constant.` },
      { part: '(a)', marks: 3, q: R`Simplify \(K\dfrac{\partial Y}{\partial K} + L\dfrac{\partial Y}{\partial L}\).`, opts: optsM(v.eul), why: v.eulWhy + R` So by Euler's theorem \(Y\) is homogeneous of degree \(${v.n}\).` },
      { part: '(b)', marks: 3, q: R`\(Y(\lambda K, \lambda L)\) equals:`, opts: optsM(v.dir), why: R`Each input brings its power of \(\lambda\); add the powers: \(\lambda^{${v.n}}\).` },
      { part: '(c)', marks: 1, q: `Returns to scale are:`, opts: opts([v.rts].concat(rtsList.filter(x => x !== v.rts)).map(x => x[0].toUpperCase() + x.slice(1))),
        why: R`Degree \(${v.n}\): ` + (v.rts === 'constant' ? 'equal to 1.' : v.rts === 'increasing' ? 'more than 1.' : 'less than 1.') },
      { part: '(c)', marks: 1, q: `If both inputs double, output is multiplied by:`, opts: opts(v.dbl), why: R`Multiply by \(2^n\) with \(n = ${v.n}\).` }
    ];
    return { question, short: Y, steps };
  },
  C() {
    const v = pick(C_VARIANTS);
    const g = m('g(x, y) = ' + v.g);
    const question = `<p>Consider the function ${g}.</p><ol type="a">
      <li>State the first-order conditions for a stationary point, and the second-order conditions for it to be a maximum, a minimum or a saddle point. <span class="marks">[4]</span></li>
      <li>Show that \\(g\\) has a stationary point at \\(${v.pt}\\). <span class="marks">[3]</span></li>
      <li>Find \\(g_{xx}\\), \\(g_{yy}\\), \\(g_{xy}\\) and \\(g_{yx}\\). <span class="marks">[4]</span></li>
      <li>Determine the nature of the stationary point at \\(${v.pt}\\). <span class="marks">[4]</span></li></ol>`;
    const natList = ['minimum', 'maximum', 'saddle point'];
    const steps = [
      { part: '(a)', marks: 1, q: `The first-order conditions are:`, opts: optsM([R`g_x = 0 \text{ and } g_y = 0`, R`g_{xx} = 0 \text{ and } g_{yy} = 0`, R`g(x, y) = 0`, R`g_x = g_y`]), why: R`The slope must be zero in both directions.` },
      { part: '(a)', marks: 3, q: R`A stationary point is a maximum if (with \(D = g_{xx}g_{yy} - g_{xy}^2\)):`,
        opts: optsM([R`g_{xx} < 0,\ g_{yy} < 0 \text{ and } D > 0`, R`g_{xx} < 0 \text{ and } g_{yy} < 0`, R`g_{xx} > 0,\ g_{yy} > 0 \text{ and } D > 0`, R`D < 0`]),
        why: R`Max: \(g_{xx}, g_{yy} < 0\) and \(D > 0\). Min: \(g_{xx}, g_{yy} > 0\) and \(D > 0\). Saddle: \(D < 0\).` },
      { part: '(b)', marks: 1, q: R`What is \(g_x\)?`, opts: optsM(v.gx), why: R`Treat \(y\) as a constant: \(\frac{\partial}{\partial x}e^{xy} = ye^{xy}\).` },
      { part: '(b)', marks: 1, q: R`What is \(g_y\)?`, opts: optsM(v.gy), why: R`Treat \(x\) as a constant: \(\frac{\partial}{\partial y}e^{xy} = xe^{xy}\).` },
      { part: '(b)', marks: 1, q: R`At \(${v.pt}\), every \(e^{xy}\) term equals:`, opts: optsM(['1', '0', 'e', R`e^{x}`]), why: R`\(xy = 0\) there and \(e^0 = 1\). So ` + v.chk + R`: a stationary point.` },
      { part: '(c)', marks: 2, q: R`What is \(g_{xy}\) (which equals \(g_{yx}\))?`, opts: optsM(v.gxy), why: R`Differentiate \(g_x\) with respect to \(y\), using the product rule. Also ` + v.sec + '.' },
      { part: '(c)', marks: 2, q: R`At \(${v.pt}\), the second-order partials are:`, opts: opts(v.val), why: v.sec + R`, evaluated with \(e^{xy} = 1\).` },
      { part: '(d)', marks: 2, q: R`\(D = g_{xx}g_{yy} - g_{xy}^2\) at the point is:`, opts: optsM(v.D), why: v.natWhy },
      { part: '(d)', marks: 2, q: `So the point is a:`, opts: opts([v.nat].concat(natList.filter(x => x !== v.nat)).concat(['cannot tell'])), why: v.natWhy }
    ];
    return { question, short: g + ' at ' + m(v.pt), steps };
  },
  D() {
    const c = pick(D_COST), u = pick(D_UTIL);
    const F = m('F(K, L) = ' + c.F), U = m('u(x, y) = ' + u.u);
    const question = `<p><b>(a)</b> A firm has production function ${F}. The rental rate of capital is \\(r = ${c.r}\\) and the wage is \\(w = ${c.w}\\). It wants to produce ${c.y} units at minimum cost.</p>
      <ol type="i"><li>Write down the firm's problem and the Lagrangian. <span class="marks">[3]</span></li>
      <li>Find the first-order conditions. <span class="marks">[3]</span></li>
      <li>Find the cost-minimising \\(K\\) and \\(L\\), and the minimum cost. <span class="marks">[4]</span></li></ol>
      <p><b>(b)</b> A consumer has utility ${U}, prices \\(p_x = ${u.px}\\), \\(p_y = ${u.py}\\) and income ${u.m}. Use the Lagrangian method to find her optimal bundle. It is recommended that you take logs of the utility function. <span class="marks">[10]</span></p>`;
    const cf = n => (n === 1 ? '' : String(n));
    const lag = [R`${cf(c.r)}K + ${cf(c.w)}L - \lambda\left(${c.F} - ${c.y}\right)`, R`${c.F} - \lambda(${cf(c.r)}K + ${cf(c.w)}L - ${c.y})`,
                 R`${cf(c.w)}K + ${cf(c.r)}L - \lambda\left(${c.F} - ${c.y}\right)`, R`${cf(c.r)}K + ${cf(c.w)}L - \lambda\left(${c.F}\right)`];
    const ulag = [R`\mathcal{L} = ${u.logs[0]} - \lambda(${cf(u.px)}x + ${cf(u.py)}y - ${u.m})`, R`\mathcal{L} = ${u.logs[0]} - \lambda(${cf(u.py)}x + ${cf(u.px)}y - ${u.m})`,
                  R`\mathcal{L} = ${cf(u.px)}x + ${cf(u.py)}y - \lambda\left(${u.logs[0]} - ${u.m}\right)`, R`\mathcal{L} = ${u.logs[0]} - \lambda(${cf(u.px)}x + ${cf(u.py)}y)`];
    const steps = [
      { part: '(a)(i)', marks: 3, q: R`Which is the right Lagrangian \(\mathcal{L}\)?`, opts: optsM(lag), why: R`Minimise cost \(${cf(c.r)}K + ${cf(c.w)}L\) subject to \(${c.F} = ${c.y}\): \(\mathcal{L} = \text{cost} - \lambda(\text{output} - ${c.y})\).` },
      { part: '(a)(ii)', marks: 3, q: R`The first-order condition \(\mathcal{L}_K = 0\) gives:`, opts: optsM(c.foc), why: R`Differentiate with respect to \(K\): the rental rate equals \(\lambda\) times the marginal product of capital.` },
      { part: '(a)(iii)', marks: 2, q: R`Dividing the first two FOCs (so \(\lambda\) cancels) gives:`, opts: optsM(c.ratio), why: c.ratioWhy },
      { part: '(a)(iii)', marks: 1, q: `Substituting into the output constraint:`, opts: optsM(c.KL), why: c.KLWhy },
      { part: '(a)(iii)', marks: 1, q: `The minimum cost is:`, opts: optsM(c.cost), why: c.costWhy },
      { part: '(b)', marks: 2, q: R`Taking logs, \(\ln u\) is:`, opts: optsM(u.logs), why: R`The log of a product is a sum of logs, and powers come out in front.` },
      { part: '(b)', marks: 1, q: `So the Lagrangian is:`, opts: optsM(ulag), why: R`Objective (in logs) minus \(\lambda\) times (spending minus income).` },
      { part: '(b)', marks: 2, q: `The first-order conditions for x and y are:`, opts: optsM(u.foc), why: R`Differentiate: \(\frac{\partial}{\partial x}(a\ln x) = \frac{a}{x}\), which must equal \(\lambda p_x\).` },
      { part: '(b)', marks: 2, q: R`Eliminating \(\lambda\) gives:`, opts: optsM(u.ratio), why: u.ratioWhy },
      { part: '(b)', marks: 3, q: `So the optimal bundle is:`, opts: optsM(u.xy), why: u.xyWhy }
    ];
    return { question, short: `(a) ${F}, r = ${c.r}, w = ${c.w}, ${c.y} units. (b) ${U}, prices ${u.px} and ${u.py}, income ${u.m}.`, steps };
  }
};

// ---------- sketches for problem A ----------
function plotSVG(fn, dom) {
  const W = 200, H = 140, pad = 10, N = 160, xs = [], ys = [];
  for (let i = 0; i <= N; i++) { const x = dom[0] + (dom[1] - dom[0]) * i / N; xs.push(x); ys.push(fn(x)); }
  let lo = Math.min(...ys, 0), hi = Math.max(...ys, 0); const sp = (hi - lo) || 1; lo -= 0.08 * sp; hi += 0.08 * sp;
  const X = x => pad + (W - 2 * pad) * (x - dom[0]) / (dom[1] - dom[0]);
  const Y = y => H - pad - (H - 2 * pad) * (y - lo) / (hi - lo);
  let s = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  s += `<line x1="${pad}" y1="${Y(0)}" x2="${W - pad}" y2="${Y(0)}" stroke="#8a94a6" stroke-width="1"/>`;
  if (dom[0] < 0 && dom[1] > 0) s += `<line x1="${X(0)}" y1="${pad - 4}" x2="${X(0)}" y2="${H - pad + 4}" stroke="#8a94a6" stroke-width="1"/>`;
  for (let t = Math.ceil(dom[0]); t <= Math.floor(dom[1]); t++) {
    if (t === 0) continue;
    s += `<line x1="${X(t)}" y1="${Y(0) - 2.5}" x2="${X(t)}" y2="${Y(0) + 2.5}" stroke="#8a94a6"/><text x="${X(t)}" y="${Y(0) + 11}" font-size="8" text-anchor="middle" fill="#5b6576">${t}</text>`;
  }
  s += `<polyline fill="none" stroke="#13807a" stroke-width="2.2" points="${xs.map((x, i) => X(x).toFixed(1) + ',' + Y(ys[i]).toFixed(1)).join(' ')}"/></svg>`;
  return s;
}
function sketchOptions(v) {
  const f = v.fn, d = v.dom, cands = [x => -f(x), x => f(-x), x => f(x - 1), x => -f(-x), x => f(x + 1), x => f(x) - 0.5 * Math.abs(f(d[1]))];
  const sample = g => { const a = []; for (let i = 0; i <= 40; i++) a.push(g(d[0] + (d[1] - d[0]) * i / 40)); return a; };
  const scale = Math.max(...sample(f).map(Math.abs)) || 1;
  const chosen = [f];
  for (const g of cands) {
    if (chosen.length === 4) break;
    const sg = sample(g);
    if (chosen.every(h => { const sh = sample(h); return Math.max(...sh.map((y, i) => Math.abs(y - sg[i]))) > 0.15 * scale; })) chosen.push(g);
  }
  return chosen.map((g, i) => ({ t: plotSVG(g, d), ok: i === 0, svg: true }));
}

function route() {
  const h = location.hash || '#/';
  const p = h.slice(2).split('/');
  if (p[0] === 'skills') viewSkills();
  else if (p[0] === 'skill') viewSkill(p[1]);
  else if (p[0] === 'weekly') viewWeekly();

  else if (p[0] === 'exam' && p[1]) viewExam(p[1]);
  else viewHome();
}
